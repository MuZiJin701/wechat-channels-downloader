name: Verify and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-14, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked playwright install --with-deps --no-shell chromium
      - run: uv run --locked mypy
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: uv run --locked python tools/build.py
      - name: Validate Linux launcher
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils
          desktop-file-validate dist/wechat-channels-downloader/*.desktop
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: wechat-channels-downloader-${{ runner.os }}-${{ runner.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
