[project]
name = "wechat-channels-downloader"
version = "0.1.0"
description = "Portable TUI for downloading WeChat Channels videos and image posts"
requires-python = ">=3.11,<3.12"
dependencies = [
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "playwright>=1.64.0",
    "textual>=8.2.8",
]

[tool.mypy]
files = ["downloader", "main.py", "tools"]
strict = true

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pyinstaller>=6.22.3",
]
